# nginx does two jobs in this container:
#   1. serves the static frontend (HTML/CSS/JS)
#   2. acts as the API gateway, forwarding /api/<service>/... to that service
#
# "auth", "challenges", etc. are resolved by DNS: docker-compose service names
# locally, Kubernetes Service names in the cluster. A Kubernetes Service
# load-balances across every ready pod behind it.

# Don't advertise the nginx version in headers or error pages.
server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic browser hardening. (nginx only inherits add_header into a location
    # that sets none of its own, so the locations below that add headers
    # repeat these.)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Liveness/readiness probe, answered by nginx itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API gateway ----
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    15s;

    # No URI after the host in proxy_pass = forward the path unchanged,
    # so /api/auth/login reaches the auth service as /api/auth/login.
    location /api/auth        { proxy_pass http://auth:8080; }
    location /api/challenges  { proxy_pass http://challenges:8080; }
    location /api/submissions { proxy_pass http://submissions:8080; }
    location /api/scoreboard  { proxy_pass http://scoreboard:8080; }

    # Admin-only status endpoints (the services check the admin token).
    # Only these responses say which frontend pod served them, and only on
    # success: add_header without "always" skips 401/403 responses.
    location = /api/auth/info        { include /etc/nginx/conf.d/info.inc; proxy_pass http://auth:8080; }
    location = /api/challenges/info  { include /etc/nginx/conf.d/info.inc; proxy_pass http://challenges:8080; }
    location = /api/submissions/info { include /etc/nginx/conf.d/info.inc; proxy_pass http://submissions:8080; }
    location = /api/scoreboard/info  { include /etc/nginx/conf.d/info.inc; proxy_pass http://scoreboard:8080; }

    # Anything else under /api is unknown. Note /internal/... routes are
    # never forwarded, so they are unreachable from outside the cluster.
    location /api/ {
        default_type application/json;
        return 404 '{"error":"unknown API route"}';
    }

    # Never cache version.json, so a rollout is visible on the next refresh.
    location = /version.json {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
